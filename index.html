<!DOCTYPE html>
<html>
<head>
<style>

    body{
        background-color:#1e1e1e;
        font-family:Arial, sans-serif;
        color:white;
    }

    .container{
        width:400px;
        margin:auto;
        margin-top:100px;
        text-align:center;
        background-color:#2d2d2d;
        padding:30px;
        border-radius:15px;
        box-shadow:0px 0px 20px rgba(0,0,0,0.5);
    }

    .guess{
        background-color:silver;
        color:black;
        padding:20px;
        border:5px solid black;
        border-radius:10px;
    }

    .inp{
        width:80%;
        padding:12px;
        margin-top:20px;
        border:3px solid black;
        border-radius:8px;
        font-size:18px;
        text-align:center;
    }

    .but{
        margin-top:20px;
        padding:12px 25px;
        border:3px solid black;
        border-radius:8px;
        background-color:orange;
        font-size:18px;
        cursor:pointer;
    }

    .but:hover{
        background-color:yellow;
    }

    #p1,#p2{
        margin-top:20px;
        font-size:22px;
    }

</style>
</head>

<body>

<div class="container">

    <h1 class="guess">Guessing the Number</h1>

    <input id="one" class="inp" placeholder="Type your number">

    <br>

    <button onclick="check()" class="but">Check</button>

    <h2 id="p1">Your guess is right or wrong</h2>

    <h2 id="p2">Your score: 10</h2>

</div>

<script>

    var one = document.getElementById("one")
    var para1 = document.getElementById("p1")
    var para2 = document.getElementById("p2")

    var random = Math.floor(Math.random()*10)+1

    var score = 10

    function check(){

        var number = Number(one.value)

        if(random == number){

            alert('You won')

            console.log("you are right")

            para1.textContent = "Your guess is right"

        }

        else{

            score = score - 1

            para2.textContent = "Your score: " + score

            para1.textContent = "Your guess is wrong"

            console.log("you are wrong")

        }

    }

</script>

</body>
</html>
